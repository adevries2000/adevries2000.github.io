<!DOCTYPE html>
<html lang="en">
<head>
    
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications and Presentations - Albert De Vries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a4d2e;
            --secondary: #c17817;
            --accent: #d4a574;
            --text-dark: #2c3e50;
            --text-light: #5a6c7d;
            --bg-cream: #faf8f5;
            --bg-white: #ffffff;
            --border: #e5ddd5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #24292e;
            background-color: #ffffff;
            padding: 0;
            margin: 0;
            overflow-y: scroll;
        }

        h1, h2, h3 {
            font-family: 'Crimson Pro', serif;
            font-weight: 700;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #1a4d2e;
            border-bottom: 1px solid #164228;
            z-index: 1000;
        }

        nav .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 70px;
        }

        nav .logo {
            font-family: 'Crimson Pro', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            flex-wrap: wrap;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a:hover {
            color: #d4a574;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #d4a574;
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a.active {
            color: #d4a574;
        }

        nav a.active::after {
            width: 100%;
        }

        /* Main Content */
        .content-wrapper {
            margin-top: 70px;
            padding: 20px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        main {
            margin-top: 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1.875rem;
            color: #24292e;
        }

        .bio-content {
            margin-top: 1.25rem;
        }

        .bio-content p {
            margin-bottom: 1.5rem;
            color: #586069;
            font-size: 1rem;
            line-height: 1.6;
        }

        .bio-content p:last-child {
            margin-bottom: 0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem 1.25rem 1.25rem;
            color: #586069;
            font-size: 0.75rem;
            margin-top: 3.75rem;
            border-top: 1px solid #e1e4e8;
        }

        /* Profile Links */
        .profile-links {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 1.25rem;
        }

        .profile-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            text-decoration: none;
            color: #24292e;
            transition: all 0.2s ease;
        }

        .profile-link:hover {
            border-color: #1a4d2e;
            background-color: #f6f8fa;
            transform: translateX(4px);
        }

        .profile-link img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .profile-link-content {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .profile-link-title {
            font-weight: 600;
            color: #24292e;
            font-size: 1rem;
        }

        .profile-link-url {
            font-size: 0.875rem;
            color: #586069;
            word-break: break-all;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content-wrapper {
                padding: 15px;
                margin-top: 120px;
            }

            nav .container {
                padding: 1rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            nav ul {
                gap: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .content-wrapper {
                margin-top: 140px;
            }

            nav .container {
                padding: 0.8rem 1rem;
            }

            nav .logo {
                font-size: 1.1rem;
            }

            nav ul {
                gap: 0.5rem 1rem;
                font-size: 0.85rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">Albert De Vries</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="biography.html">Biography</a></li>
                <li><a href="pubstalks.html" class="active">Pubs & Talks</a></li>
                <li><a href="tools.html">Tools</a></li>

            </ul>
        </div>
    </nav>

    <div class="content-wrapper">
        <main>
            <h1>Publications and Presentations</h1>

            <div class="bio-content">
                <div class="profile-links">
                    <a href="https://scholar.google.com/citations?user=OfKvIdIAAAAJ&hl=en" target="_blank" class="profile-link">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Google_Scholar_logo.svg" alt="Google Scholar">
                        <div class="profile-link-content">
                            <span class="profile-link-title">Google Scholar</span>
                            <span class="profile-link-url">View publications and citations</span>
                        </div>
                    </a>
                    
                    <a href="https://orcid.org/0000-0003-4511-0388" target="_blank" class="profile-link">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/0/06/ORCID_iD.svg" alt="ORCID">
                        <div class="profile-link-content">
                            <span class="profile-link-title">ORCID</span>
                            <span class="profile-link-url">View publications</span>
                        </div>
                    </a>
                    
                    <a href="https://www.researchgate.net/profile/Albert-De-Vries-2/publications" target="_blank" class="profile-link">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/ResearchGate_icon_SVG.svg" alt="ResearchGate">
                        <div class="profile-link-content">
                            <span class="profile-link-title">ResearchGate</span>
                            <span class="profile-link-url">View my selected publications and presentions</span>
                        </div>
                    </a>
                </div>
            </div>
        </main>

       <footer>
            <p>Last modified: <span id="lastModified"></span></p>
        </footer>
    </div>
    
    <script>
        // Display the last modified date
        document.getElementById('lastModified').textContent = document.lastModified;
    </script>
</body>
</html>
